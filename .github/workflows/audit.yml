name: Security audit

# Release CI calls this workflow as a required publication gate.
# A weekly schedule and workflow_dispatch provide continuous/on-demand audits.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.99.0"

      - name: Install cargo-audit
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit@0.22.1

      - name: Run cargo audit (root)
        # paste is required by argmin 0.11; RUSTSEC-2024-0436 is informational
        # and has no patched argmin release. Deny every other warning.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: Run cargo audit (python/)
        working-directory: python
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  pip-audit:
    name: pip-audit (${{ matrix.project }}/uv.lock)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [python, benchmarks/python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.24"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"

      - name: pip-audit
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.project }}" = python ]; then
            uv sync --locked --extra dev --no-install-project
          else
            uv sync --locked
          fi
          uv run --no-sync pip-audit
