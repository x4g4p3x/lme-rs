version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories: ["/", "/python"]
    schedule:
      interval: weekly
    groups:
      rust-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directories: ["/python", "/benchmarks/python"]
    schedule:
      interval: weekly
    groups:
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
