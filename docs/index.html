<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lme-rs Benchmark Pages</title>
  <meta http-equiv="refresh" content="0; url=./benchmarks/">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --fg: #172333;
      --muted: #536277;
      --accent: #1758bc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(40rem, calc(100vw - 3rem));
      padding: 2rem;
      border: 1px solid rgba(23, 33, 39, 0.12);
      background: white;
      border-radius: 0.8rem;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(23, 33, 39, 0.08);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>lme-rs Benchmark Pages</h1>
    <p>Redirecting to the fair fit-only benchmark dashboard.</p>
    <p><a href="./benchmarks/">Open the benchmark dashboard</a></p>
  </main>
</body>
</html>
