[package]
name = "lme_python"
version = "0.2.8-dev.0"
edition = "2021"
rust-version = "1.95"
authors = ["Martin Huck <x4g4p3x@users.noreply.github.com>"]
description = "Python bindings for lme-rs"

[lib]
name = "lme_python"
crate-type = ["cdylib"]

[features]
# Shared release wheels; source builds retain interpreter-specific optimizations.
abi3 = ["pyo3/abi3-py310"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
polars = { version = "0.55.2", default-features = false, features = ["polars-io"] }
# The internal bridge writes uncompressed IPC; avoid optional compression codecs.
polars-arrow = { version = "0.55.2", default-features = false, features = ["io_ipc"] }
lme-rs = { path = ".." }
ndarray = "0.17.2"
